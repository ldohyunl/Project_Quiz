{% load static %}

<!-- 📌 히스토리 스타일 적용 -->
<link rel="stylesheet" href="{% static 'history/history.css' %}">

<!-- 📌 히스토리 헤더 -->
<div class="history-header">
    <div class="header-text">
        <h1 class="history-title">히스토리</h1>
        <p class="history-subtitle">생성된 퀴즈를 한눈에 확인하세요. 부족한 퀴즈는 다시 풀어볼 수 있습니다!</p>
    </div>

    <!-- ✅ 검색 바 디자인 + 버튼 추가 -->
    <div class="search-container">
        <div class="search-background"></div>  <!-- ✅ 배경 크기 맞춤 -->
        <form method="GET" class="search-wrapper">
            <input type="text" name="search" class="search-input" placeholder="과목명으로 검색" value="{{ search_query }}">
            <button type="submit" class="search-btn">
                <i class="fas fa-search"></i> <!-- ✅ 돋보기 아이콘 정상 표시 -->
            </button>
        </form>
    </div>
</div>

<!-- ✅ 헤더와 리스트 사이 점선 -->
<div class="header-divider"></div>

<!-- ✅ 히스토리 목록 -->
<div class="history-container">
    {% for date, quiz_group in quizzes.items %}
    <div class="history-day" data-date="{{ date|date:'Y-m-d' }}">  <!-- ✅ YYYY-MM-DD 형식으로 변환 -->
        <h2 class="history-date">{{ date|date:"Y년 m월 d일" }}</h2>
        <hr>
        <div class="quiz-list">
            {% for quiz in quiz_group %}
            <div class="quiz-card">
                <div class="quiz-info">
                    <span class="quiz-subject">{{ quiz.file_name }}</span>
                </div>
                <div class="quiz-actions">
                    <button class="quiz-btn type">
                        {% if quiz.question_type == "Short" %} 단답형
                        {% elif quiz.question_type == "MCQ" %} 4지선다
                        {% elif quiz.question_type == "OX" %} O/X
                        {% else %} {{ quiz.question_type }}
                        {% endif %}
                    </button>
                    <button class="quiz-btn score">{{ quiz.score|default:"-" }}점</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const historyDays = document.querySelectorAll('.history-day');

        function animateHistoryItems() {
            let middleScreen = window.innerHeight / 2;
            let closest = null;
            let minDistance = Infinity;

            historyDays.forEach(day => {
                let rect = day.getBoundingClientRect();
                let distance = Math.abs(rect.top - middleScreen);

                if (distance < minDistance) {
                    minDistance = distance;
                    closest = day;
                }
            });

            historyDays.forEach(day => {
                if (day === closest) {
                    day.classList.add('active');
                } else {
                    day.classList.remove('active');
                }
            });
        }

        window.addEventListener('scroll', animateHistoryItems);
        animateHistoryItems();

        // ✅ 클릭 시 YYYY-MM-DD 형식으로 페이지 이동
        document.addEventListener("click", function (event) {
            const activeDay = document.querySelector('.history-day.active');
            if (activeDay && activeDay.contains(event.target)) {
                const selectedDate = activeDay.getAttribute('data-date');  // YYYY-MM-DD 형식
                if (selectedDate) {
                    window.location.href = `/history/${selectedDate}/`;
                }
            }
        });
    });
</script>
