{% load static %}
{% load i18n %}
{% load socialaccount %}
<!---
<link rel="stylesheet" type="text/css" href="{% static 'accounts/login.css' %}">
<link rel="stylesheet" type="text/css" href="{% static 'accounts/global.css' %}">
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>로그인</title>
<!-- 반응형 메타태그 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Pretendard 폰트 (CDN) -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
/>
<style>
    /* 초기화 */
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }
    html, body {
    height: 100%;
    font-family: 'Pretendard', sans-serif;
    background: #fff;
    }

    /* 메인 컨테이너: 왼쪽(40% 회색) + 오른쪽(60% 흰색) */
    .container {
    display: flex;
    width: 100%;
    min-height: 100vh;
    }

    /* 왼쪽 영역(회색, 폭 40%), 수직선 제거 */
    .left-area {
    flex: 0 0 40%;
    background-color: #ccc;
    /* 수직선(border-right)은 제거 */
    }

    /* 오른쪽 영역(흰색, 폭 60%), position: relative */
    .right-area {
    flex: 0 0 60%;
    position: relative; /* 자식(로그인 폼)을 절대 배치 */
    overflow: hidden;
    }

    /* 로그인 폼: 오른쪽 영역 안에서 1:4(25%) 지점에 수평 배치 */
    .login-form {
    position: absolute;
    top: 50%;
    left: 25%; /* 1대4 근사치 */
    transform: translateY(-50%);
    width: 400px;  /* 폼 폭 */
    text-align: left;
    }

    /* 로그인 타이틀 */
    .login-title {
    font-size: 2.5rem;
    font-weight: 900;
    margin-bottom: 0.5rem;
    }
    .title-underline {
    width: 100px;
    height: 3px;
    background-color: #000;
    margin-bottom: 2rem;
    }

    /* 아이디/비밀번호 인풋 */
    .login-input {
    display: block;
    width: 100%;
    margin-bottom: 1rem;
    padding: 0.8rem 1rem;
    border: none;
    border-radius: 9999px;
    background-color: #e0e0e0;
    font-size: 1rem;
    color: #333;
    }
    .login-input::placeholder {
    color: #505050;
    font-weight: 300;
    }

    /* 로그인 버튼 */
    .login-button {
    display: block;
    width: 100%;
    padding: 0.8rem;
    border: none;
    border-radius: 9999px;
    background-color: #000;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
    margin-bottom: 1rem; /* SNS 버튼과 동일 간격 */
    }
    .login-button:hover {
    background-color: #f49303;
    color: #000;
    }

    /* SNS 버튼 래퍼 */
    .sns-button-row {
    width: 400px; /* 인풋/로그인 버튼 폭과 맞춤 */
    display: flex;
    gap: 20px;  /* 버튼 사이 간격 */
    }

    /* 네이버/카카오 버튼 */
    .sns-button {
    width: 190px;
    padding: 0.8rem;
    border: none;
    border-radius: 9999px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    transition: filter 0.3s;
    }
    .naver-btn {
    background-color: #03c75a;
    color: #000;
    }
    .naver-btn:hover {
    filter: brightness(0.9);
    }
    .kakao-btn {
    background-color: #fee500;
    color: #000;
    }
    .kakao-btn:hover {
    filter: brightness(0.9);
    }

    /* 반응형: 폭 <= 768px -> 세로 스택 */
    @media (max-width: 768px) {
    .container {
        flex-direction: column;
    }
    .left-area {
        width: 100%;
        height: 200px;
    }
    .right-area {
        flex: none;
        width: 100%;
    }
    .login-form {
        position: static;  /* 절대 배치 해제 */
        transform: none;
        margin: 2rem auto; /* 중앙 정렬 */
    }
    .sns-button-row {
        width: 100%;
        justify-content: space-between;
    }
    }
</style>
</head>
<body>
<div class="container">
    <!-- 왼쪽 영역 (회색, 40%) -->
    <div class="left-area"></div>

    <!-- 오른쪽 영역 (흰색, 60%) -->
    <div class="right-area">
    <div class="login-form">
        <h1 class="login-title">로그인</h1>
        <div class="title-underline"></div>

        <input
        type="text"
        class="login-input"
        placeholder="이메일 또는 아이디"
        />
        <input
        type="password"
        class="login-input"
        placeholder="비밀번호"
        />

        <button class="login-button">로그인</button>

        <div class="sns-button-row">
            <form action={% provider_login_url 'naver' %}?process=login" method="get">
                <button class="sns-button naver-btn">네이버로 로그인</button>
            </form>
            <form action="{% provider_login_url 'kakao' process='login' %}" method="get">
                <button class="sns-button kakao-btn">카카오로 로그인</button>
            </form>
        </div>
    </div>
    </div>
</div>
</body>
</html>
