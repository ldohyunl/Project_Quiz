
<!DOCTYPE html>
{% load static %}
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>객관식 4지선다 - 예시</title>
  <!-- 외부 CSS 파일 연결 (객관식 퀴즈 스타일) -->
  <link rel="stylesheet" href="{% static 'quiz_app/example_html.css' %}">
</head>
<body>
  <!-- ==========================================
       퀴즈 인터페이스 영역
       - 퀴즈 헤더 (아이콘, 진행바, 문제 번호)
       - 퀴즈 본문 (문제, 보기 리스트)
       - 결과 표시 영역 (정답/오답, 버튼)
  =========================================== -->
  <div class="quiz-wrapper" id="quizWrapper">
    <!-- 퀴즈 헤더 -->
    <div class="quiz-header">
      <div class="quiz-icon">Q</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="question-count" id="questionCountText">1/10</div>
    </div>
    <!-- 퀴즈 본문 -->
    <div class="quiz-body">
      <div class="question-number" id="questionNumber"></div>
      <div class="question-text" id="questionText"></div>
      <ul class="choices" id="choicesList"></ul>
    </div>
    <!-- 결과 표시 영역 -->
    <div class="result-bar" id="resultBar">
      <div class="result-info" id="resultText"></div>
      <div class="btn-box">
        <button class="quiz-btn confirm" id="confirmBtn">확인</button>
        <button class="quiz-btn next" id="nextBtn" style="display:none;">계속</button>
      </div>
    </div>
  </div>

  <!-- ==========================================
       퀴즈 완료 영역
       - 최종 점수 표시 및 재시작, 공유, 홈 이동 버튼 제공
  =========================================== -->
  <div class="quiz-complete-wrapper" id="quizCompleteWrapper" style="display:none;">
    <div class="quiz-complete-icon">★</div>
    <h2 class="quiz-complete-title">퀴즈 완료</h2>
    <div class="quiz-complete-score" id="finalScore">0/10</div>
    <div class="quiz-complete-button-row">
      <div class="btn-icon" id="btnRestart">
        <div>↩</div>
        <span>재시작</span>
      </div>
      <div class="btn-icon" id="btnShare">
        <div>🔗</div>
        <span>공유</span>
      </div>
    </div>
    <!-- 액션 버튼: 새로운 퀴즈 생성 및 홈으로 이동 -->
    <button class="quiz-complete-restart-btn" id="createNewQuizBtn">새로운 퀴즈 생성</button>
    <button class="quiz-complete-home-btn" id="goHomeBtn">홈으로 가기</button>
  </div>

  <!-- ==========================================
       자바스크립트 로직 영역
       - 퀴즈 데이터, 전역 변수, DOM 요소, 이벤트 및 함수 정의
  =========================================== -->
  <script>
    // Django 템플릿에서 전달한 quiz_data (딕셔너리 형태)
    // 예: { "1": {"question": "...", "choices": {...}, "correct_answer": "a"}, "2": {...} }
    const quizDataDict = {{ quiz_data|safe }};

    // 딕셔너리 키를 숫자로 변환 후 정렬 (키: "1", "2", ...)
    const quizKeys = Object.keys(quizDataDict).sort((a, b) => parseInt(a) - parseInt(b));

    // quizDataDict를 배열로 변환하여 사용
    // 변환 결과 예: [{question: "문제", choices: {...}, correct_answer: "a"}, ...]
    const quizData = quizKeys.map(key => quizDataDict[key]);

    // ===== 전역 변수 =====
    const labels = ["A", "B", "C", "D"];
    let currentQuestionIndex = 0;
    let userAnswer = null;
    let isConfirmed = false;
    const totalQuestions = quizData.length;
    let correctCount = 0;

    // ===== DOM 요소 참조 =====
    const quizWrapper = document.getElementById("quizWrapper");
    const quizCompleteWrapper = document.getElementById("quizCompleteWrapper");
    const questionCountText = document.getElementById("questionCountText");
    const progressFill = document.getElementById("progressFill");
    const questionNumberEl = document.getElementById("questionNumber");
    const questionTextEl = document.getElementById("questionText");
    const choicesListEl = document.getElementById("choicesList");
    const confirmBtn = document.getElementById("confirmBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resultBar = document.getElementById("resultBar");
    const resultText = document.getElementById("resultText");
    const finalScoreEl = document.getElementById("finalScore");

    // ===== 초기 퀴즈 로드 =====
    loadQuestion();

    // 함수: 현재 문제와 보기를 로드하여 화면에 표시
    function loadQuestion() {
      updateProgressBar();
      questionCountText.textContent = `${currentQuestionIndex + 1}/${totalQuestions}`;

      // 상태 초기화
      isConfirmed = false;
      userAnswer = null;
      confirmBtn.style.display = "inline-block";
      nextBtn.style.display = "none";
      resultBar.className = "result-bar";
      resultText.innerHTML = "";

      // 현재 문제 객체
      const q = quizData[currentQuestionIndex];
      // 예: { question: "문제 내용", choices: {a: "보기1", b: "보기2", ...}, correct_answer: "b" }

      // 문제 텍스트 표시
      questionNumberEl.textContent = `문제 ${currentQuestionIndex + 1}`;
      questionTextEl.textContent = q.question;

      // 선택지 초기화
      choicesListEl.innerHTML = "";
      // 딕셔너리 형태의 choices를 [보기1, 보기2, 보기3, 보기4] 배열로 변환
      const choiceKeys = Object.keys(q.choices).sort(); // a, b, c, d 순
      const options = choiceKeys.map(key => q.choices[key]);

      options.forEach((opt, idx) => {
        const li = document.createElement("li");
        li.className = "choice-item";
        li.dataset.index = idx;

        const spanText = document.createElement("span");
        spanText.className = "choice-text";
        spanText.textContent = opt;

        const labelSpan = document.createElement("span");
        labelSpan.className = "choice-label";
        labelSpan.textContent = labels[idx] || "";

        li.appendChild(spanText);
        li.appendChild(labelSpan);

        // 선택 이벤트
        li.addEventListener("click", () => {
          if (isConfirmed) return;
          selectChoice(idx);
        });

        choicesListEl.appendChild(li);
      });
    }

    // 함수: 선택한 보기의 인덱스를 기록하고 UI에 선택 상태 표시
    function selectChoice(idx) {
      userAnswer = idx;
      document.querySelectorAll(".choice-item").forEach(item => {
        item.classList.remove("selected");
      });
      const selectedEl = document.querySelector(`.choice-item[data-index='${idx}']`);
      if (selectedEl) {
        selectedEl.classList.add("selected");
      }
    }

    // 이벤트: 확인 버튼 클릭 시 정답 체크 및 결과 표시
    confirmBtn.addEventListener("click", () => {
      if (userAnswer === null) {
        alert("답안을 선택해주세요!");
        return;
      }
      if (isConfirmed) return;
      isConfirmed = true;

      const q = quizData[currentQuestionIndex];
      // correct_answer는 a, b, c, d 중 하나라고 가정
      const correctMapping = { "a": 0, "b": 1, "c": 2, "d": 3 };
      const correctIndex = correctMapping[q.correct_answer.toLowerCase()];

      const selectedEl = document.querySelector(`.choice-item[data-index='${userAnswer}']`);
      const correctEl = document.querySelector(`.choice-item[data-index='${correctIndex}']`);

      if (userAnswer === correctIndex) {
        selectedEl.classList.remove("selected");
        selectedEl.classList.add("correct");
        correctCount++;
        showResultBar(true);
      } else {
        selectedEl.classList.remove("selected");
        selectedEl.classList.add("wrong");
        if (correctEl) correctEl.classList.add("correct");
        showResultBar(false);
      }

      confirmBtn.style.display = "none";
      nextBtn.style.display = "inline-block";
    });

    // 이벤트: 다음 버튼 클릭 시 다음 문제 로드
    nextBtn.addEventListener("click", () => {
      currentQuestionIndex++;
      if (currentQuestionIndex >= totalQuestions) {
        showQuizComplete();
        return;
      }
      loadQuestion();
    });

    // 함수: 정답 여부에 따라 결과 표시 영역 스타일 및 텍스트 설정
    function showResultBar(isCorrect) {
      if (isCorrect) {
        resultBar.className = "result-bar correct";
        resultText.innerHTML = `<span class="icon">✔</span> 정답`;
        nextBtn.style.backgroundColor = "#28a745";
      } else {
        resultBar.className = "result-bar wrong";
        resultText.innerHTML = `<span class="icon">✘</span> 오답`;
        nextBtn.style.backgroundColor = "#dc3545";
      }
    }

    // 함수: 진행바를 현재 문제 번호에 맞게 업데이트
    function updateProgressBar() {
      const ratio = (currentQuestionIndex + 1) / totalQuestions;
      progressFill.style.width = `${(ratio * 100)}%`;
    }

    // 함수: 퀴즈 완료 화면으로 전환하여 최종 점수 표시
    function showQuizComplete() {
      quizWrapper.style.display = "none";
      quizCompleteWrapper.style.display = "block";
      finalScoreEl.textContent = `${correctCount}/${totalQuestions}`;
    }

    // ===== 추가 버튼 이벤트 =====
    // (1) "새로운 퀴즈 생성" 버튼
    document.getElementById("createNewQuizBtn").addEventListener("click", () => {
      currentQuestionIndex = 0;
      correctCount = 0;
      quizCompleteWrapper.style.display = "none";
      quizWrapper.style.display = "block";
      loadQuestion();
    });

    // (2) "홈으로 가기" 버튼
    document.getElementById("goHomeBtn").addEventListener("click", () => {
      // 필요에 따라 메인 페이지나 다른 경로로 이동
      window.location.href = "/";
    });

    // (3) 완료 화면 "재시작" 버튼
    document.getElementById("btnRestart").addEventListener("click", () => {
      currentQuestionIndex = 0;
      correctCount = 0;
      quizCompleteWrapper.style.display = "none";
      quizWrapper.style.display = "block";
      loadQuestion();
    });

    // (4) 공유 버튼 (미구현)
    document.getElementById("btnShare").addEventListener("click", () => {
      alert("공유 기능은 아직 미구현!");
    });
  </script>
</body>
</html>
