<!DOCTYPE html>
{% load static %}
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>객관식 4지선다 - 예시</title>
  <link rel="stylesheet" href="{% static 'quiz_app/example_html.css' %}">
</head>
<body>
  <!-- ✅ CSRF 토큰을 포함하는 숨겨진 폼 -->
  <form id="csrfTokenForm">
    {% csrf_token %}
  </form>

  <div class="quiz-wrapper" id="quizWrapper">
    <div class="quiz-header">
      <div class="quiz-icon">Q</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="question-count" id="questionCountText">1/10</div>
    </div>
    <div class="quiz-body">
      <div class="question-number" id="questionNumber"></div>
      <div class="question-text" id="questionText"></div>
      <ul class="choices" id="choicesList"></ul>
    </div>
    <div class="result-bar" id="resultBar">
      <div class="result-info" id="resultText"></div>
      <div class="btn-box">
        <button class="quiz-btn confirm" id="confirmBtn">확인</button>
        <button class="quiz-btn next" id="nextBtn" style="display:none;">계속</button>
      </div>
    </div>
  </div>

  <div class="quiz-complete-wrapper" id="quizCompleteWrapper" style="display:none;">
    <div class="quiz-complete-icon">★</div>
    <h2 class="quiz-complete-title">퀴즈 완료</h2>
    <div class="quiz-complete-score" id="finalScore">0/10</div>
    <div class="quiz-complete-button-row">
      <div class="btn-icon" id="btnRestart">
        <div>↩</div>
        <span>재시작</span>
      </div>
      <div class="btn-icon" id="btnShare">
        <div>🔗</div>
        <span>공유</span>
      </div>
    </div>
    <button class="quiz-complete-home-btn" id="goHomeBtn">홈으로 가기</button>
  </div>

  <script>
    // ✅ Django에서 전달한 문제 데이터 변환
    const quizDataDict = {{ quiz_data|safe }};
    const quizKeys = Object.keys(quizDataDict).sort((a, b) => parseInt(a) - parseInt(b));
    const quizData = quizKeys.map(key => quizDataDict[key]);

    const labels = ["A", "B", "C", "D"];
    let currentQuestionIndex = 0;
    let userAnswer = null;
    let isConfirmed = false;
    const totalQuestions = quizData.length;
    let correctCount = 0;

    // ✅ DOM 요소 참조
    const quizWrapper = document.getElementById("quizWrapper");
    const quizCompleteWrapper = document.getElementById("quizCompleteWrapper");
    const questionCountText = document.getElementById("questionCountText");
    const progressFill = document.getElementById("progressFill");
    const questionNumberEl = document.getElementById("questionNumber");
    const questionTextEl = document.getElementById("questionText");
    const choicesListEl = document.getElementById("choicesList");
    const confirmBtn = document.getElementById("confirmBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resultBar = document.getElementById("resultBar");
    const resultText = document.getElementById("resultText");
    const finalScoreEl = document.getElementById("finalScore");

    loadQuestion();

    function loadQuestion() {
      updateProgressBar();
      questionCountText.textContent = `${currentQuestionIndex + 1}/${totalQuestions}`;

      isConfirmed = false;
      userAnswer = null;
      confirmBtn.style.display = "inline-block";
      nextBtn.style.display = "none";
      resultBar.className = "result-bar";
      resultText.innerHTML = "";

      const q = quizData[currentQuestionIndex];
      questionNumberEl.textContent = `문제 ${currentQuestionIndex + 1}`;
      questionTextEl.textContent = q.question;

      choicesListEl.innerHTML = "";
      const choiceKeys = Object.keys(q.choices).sort();
      const options = choiceKeys.map(key => q.choices[key]);

      options.forEach((opt, idx) => {
        const li = document.createElement("li");
        li.className = "choice-item";
        li.dataset.index = idx;

        const spanText = document.createElement("span");
        spanText.className = "choice-text";
        spanText.textContent = opt;

        const labelSpan = document.createElement("span");
        labelSpan.className = "choice-label";
        labelSpan.textContent = labels[idx] || "";

        li.appendChild(spanText);
        li.appendChild(labelSpan);

        li.addEventListener("click", () => {
          if (isConfirmed) return;
          selectChoice(idx);
        });

        choicesListEl.appendChild(li);
      });
    }

    function selectChoice(idx) {
      userAnswer = idx;
      document.querySelectorAll(".choice-item").forEach(item => item.classList.remove("selected"));
      document.querySelector(`.choice-item[data-index='${idx}']`).classList.add("selected");
    }

    confirmBtn.addEventListener("click", () => {
      if (userAnswer === null) {
        alert("답안을 선택해주세요!");
        return;
      }
      if (isConfirmed) return;
      isConfirmed = true;

      const q = quizData[currentQuestionIndex];
      const correctMapping = { "a": 0, "b": 1, "c": 2, "d": 3 };
      const correctIndex = correctMapping[q.correct_answer.toLowerCase()];

      const selectedEl = document.querySelector(`.choice-item[data-index='${userAnswer}']`);
      const correctEl = document.querySelector(`.choice-item[data-index='${correctIndex}']`);

      if (userAnswer === correctIndex) {
        selectedEl.classList.remove("selected");
        selectedEl.classList.add("correct");
        correctCount++;
        showResultBar(true);
      } else {
        selectedEl.classList.remove("selected");
        selectedEl.classList.add("wrong");
        correctEl.classList.add("correct");
        showResultBar(false);
      }

      confirmBtn.style.display = "none";
      nextBtn.style.display = "inline-block";
    });

    nextBtn.addEventListener("click", () => {
      currentQuestionIndex++;
      if (currentQuestionIndex >= totalQuestions) {
        showQuizComplete();
        return;
      }
      loadQuestion();
    });

    function showResultBar(isCorrect) {
      resultBar.className = isCorrect ? "result-bar correct" : "result-bar wrong";
      resultText.innerHTML = isCorrect ? `<span class="icon">✔</span> 정답` : `<span class="icon">✘</span> 오답`;
    }

    function updateProgressBar() {
      progressFill.style.width = `${((currentQuestionIndex + 1) / totalQuestions) * 100}%`;
    }

    function showQuizComplete() {
      quizWrapper.style.display = "none";
      quizCompleteWrapper.style.display = "block";
      finalScoreEl.textContent = `${correctCount}/${totalQuestions}`;

      fetch("/save-quiz-score/", {
          method: "POST",
          headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCSRFToken()
          },
          body: JSON.stringify({ score: correctCount })
      }).then(response => response.json())
        .then(data => console.log("Score saved:", data))
        .catch(error => console.error("Error saving score:", error));
    }

    function getCSRFToken() {
      return document.querySelector('[name=csrfmiddlewaretoken]')?.value || "";
    }



// "홈으로 가기" 버튼 클릭 이벤트 등록
document.getElementById("goHomeBtn").addEventListener("click", () => {
  window.location.href = "/";  // 메인 페이지로 이동
});
  </script>
</body>
</html>
